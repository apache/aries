# GitHub Dependabot configuration file

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain dependencies for maven
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.ow2.asm:asm-all"
        versions:
          - ">=6" # artifact moved to org.ow2.asm:asm
      - dependency-name: "org.ow2.asm:asm-debug-all"
        versions:
          - ">=6" # artifact moved to org.ow2.asm:asm
      - dependency-name: "org.apache.felix:maven-bundle-plugin"
        versions:
          - ">=6.0.0" # does not support java 8
      - dependency-name: "biz.aQute.bnd:biz.aQute.bndlib"
        versions:
          - ">=7.0.0" # does not support java 8
      - dependency-name: "biz.aQute.bnd:bnd-maven-plugin"
        versions:
          - ">=7.0.0" # does not support java 8
      - dependency-name: "org.apache.derby:derby"
        versions:
          - ">=10.15.0" # does not support java 8
      - dependency-name: "org.springframework:spring-*"
        versions:
          - ">=6.0.0" # does not support java 8
      - dependency-name: "org.apache.geronimo.components:geronimo-connector"
        versions:
          - ">=4.0.0" # does not support java 8
      - dependency-name: "org.apache.servicemix.bundles:org.apache.servicemix.bundles.spring-*"
        versions:
          - ">=6.0.0" # does not support java 8
      - dependency-name: "org.apache.openjpa:openjpa"
        versions:
          - ">=4.0.0" # does not support java 8
      - dependency-name: "org.mockito:mockito*"
        versions:
          - ">=5.0.0" # does not support java 8
      - dependency-name: "org.eclipse:osgi" # should be upgraded to org.eclipse.platform:org.eclipse.osgi
        versions:
          - ">=3.9.1" # higher version removed CompositeBundle used by some artifacts
      - dependency-name: "org.ops4j.pax.cdi:pax-cdi*"
        versions:
          - ">=1.0.0" # pax-cdi is only used in blueprint maven plugin as an optional annotation provider and it's changed in version 1.x in incompatible way - blueprint-maven-plugin-annotation should be used instead since provides annotations more focused on blueprint elements
      - dependency-name: "org.ops4j.pax.exam:pax-exam*"
        versions:
          - ">=4.14.0" # does not support java 8
      - dependency-name: "org.ops4j.pax.web:pax-web*"
        versions:
          - ">=9.0.0" # does not support java 8
      - dependency-name: "org.ops4j.pax.swissbox:pax-swissbox*"
        versions:
          - ">1.8.3" # 1.9.0 does not support java 8, but 1.8.4 has SLF4j dependency which cannot be met https://github.com/ops4j/org.ops4j.pax.exam/issues/1056
