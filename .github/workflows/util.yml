name: Util - CI Build

on:
  pull_request:
    paths:
      - parent/**
      - testsupport/**
      - versioning/**
      - util/**
      - .github/workflows/util.yml
  push:
    branches:
      - 'trunk'

env:
  LC_ALL: en_US.UTF-8

jobs:
  JDKxx_Matrix:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 11, 17, 21, 25 ]
        os: [ ubuntu-latest ]
    name: JDK${{ matrix.java }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
    - name: Set up Java 8
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 8
    - name: Build parent
      shell: bash
      run: mvn -V -U -e -B -ntp clean install -f parent
    - name: Build testsupport
      shell: bash
      run: mvn -V -U -e -B -ntp -Dmaven.test.skip=true clean install -f testsupport
    - name: Build versioning
      shell: bash
      run: mvn -V -U -e -B -ntp -Dmaven.test.skip=true clean install -f versioning
    - name: Set up Java ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
      if: ${{ 8 != matrix.java }}
    - name: Build util
      shell: bash
      run: mvn -V -U -e -B -ntp clean install -f util
